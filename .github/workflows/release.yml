#
# Every merge to main is a release.
#
# VERSION at the repository root is the release stamp — the app prints it on
# Account and in the desktop avatar menu — and the tag is always `v` + that
# file. This workflow keeps the two in step on every push to main:
#
#   - VERSION names a number nobody has tagged yet: a pull request chose it.
#     The commit is tagged as-is, and no bot commit is made.
#   - VERSION names a number already tagged: the bot bumps it (beta.N while
#     the version is a pre-release, patch once it is not), commits the bump,
#     and tags that commit.
#
# Either way a GitHub Release is cut with generated notes (every merged PR
# since the last tag), and when LARAVEL_CLOUD_DEPLOY_HOOK is set, Laravel
# Cloud is asked to deploy the tagged commit. Without that secret, Cloud's
# push-to-deploy carries the release instead — the bot's own push is a real
# push and deploys like any other.
#
# The bot commits with GITHUB_TOKEN, and GitHub never starts a workflow from a
# push made with that token, so this cannot loop. The long-form walkthrough is
# docs/operations.md "Releases".
#
name: Release

on:
  push:
    branches: [main]

# One release at a time. Two merges seconds apart would otherwise both read
# the same VERSION and race for one number.
concurrency:
  group: release
  cancel-in-progress: false

# The repository's default token is read-only; tagging and the release commit
# need write on contents, and nothing else.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history and every tag: the decision below is "is this
          # number tagged already?", and a shallow clone cannot answer it.
          fetch-depth: 0

      - name: Decide the version
        id: version
        run: |
          current="$(tr -d '[:space:]' < VERSION)"

          # This exact commit already carries its tag — a re-run, or a push
          # of nothing new. There is no release to make.
          if git tag --points-at HEAD | grep -qx "v${current}"; then
            echo "v${current} is already on this commit; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/v${current}" > /dev/null; then
            next="$(.github/scripts/next-version.sh "$current")"
            echo "$next" > VERSION
            echo "v${current} is taken; bumping to v${next}."
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            next="$current"
            echo "v${next} was chosen in the pull request; tagging it as-is."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=${next}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        if: steps.version.outputs.skip == 'false'
        env:
          VERSION_NEXT: ${{ steps.version.outputs.version }}
          BUMPED: ${{ steps.version.outputs.bumped }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$BUMPED" = "true" ]; then
            git add VERSION
            git commit -m "Release v${VERSION_NEXT}"
            git push origin HEAD:main
          fi

          git tag -a "v${VERSION_NEXT}" -m "Release v${VERSION_NEXT}"
          git push origin "refs/tags/v${VERSION_NEXT}"

      - name: Publish the release notes
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NEXT: ${{ steps.version.outputs.version }}
        run: |
          # A hyphen in the version is semver's pre-release marker, and GitHub
          # shows those with a "Pre-release" badge rather than "Latest".
          flags=""
          case "$VERSION_NEXT" in
            *-*) flags="--prerelease" ;;
          esac

          gh release create "v${VERSION_NEXT}" \
            --title "v${VERSION_NEXT}" \
            --generate-notes \
            $flags

      - name: Deploy the release
        if: steps.version.outputs.skip == 'false'
        env:
          # Settings > Deployments > Deploy hook on the Cloud environment,
          # stored as a repository secret. Turn push-to-deploy OFF in the same
          # sitting, or every merge deploys twice and then a third time.
          HOOK: ${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No LARAVEL_CLOUD_DEPLOY_HOOK secret: push-to-deploy carries this release."
            exit 0
          fi

          curl --fail --silent --show-error --request POST \
            "${HOOK}?commit_hash=$(git rev-parse HEAD)"

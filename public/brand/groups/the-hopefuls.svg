<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!--
    THE HOPEFULS - the group's clubhouse mark: a geometric TH monogram
    standing on the horizon, cream above the line and first light below it.

    Drawn for the sizes x-group-icon renders at (20px menu row, 32px card
    row, 36px hero, 44px hero from sm) and scaled UP, never drawn large and
    shrunk: every stroke is a rectangle at least 10 units wide, the horizon
    is a 3-unit gap and the letters fill the tile edge to edge. Horizontals
    are a unit thinner than verticals and the crossbar sits above center,
    the way a cut typeface does it. width/height are declared beside the
    viewBox on purpose - an <img> gives a viewBox-only SVG a square intrinsic
    size - and there is no clip path, so any rasterizer draws the same
    picture. Regenerate the-hopefuls-512.png from this file in the same
    commit as any redraw; the PNG is the upload cut.
  -->
  <rect width="100" height="100" fill="#0F1A2E"/>
  <g fill="#F5F2EA">
    <rect x="13" y="24" width="33" height="10"/>
    <rect x="24" y="24" width="11" height="34"/>
    <rect x="52" y="24" width="11" height="34"/>
    <rect x="75" y="24" width="11" height="34"/>
    <rect x="52" y="44" width="34" height="10"/>
  </g>
  <g fill="#E8A33C">
    <rect x="24" y="61" width="11" height="15"/>
    <rect x="52" y="61" width="11" height="15"/>
    <rect x="75" y="61" width="11" height="15"/>
  </g>
</svg>

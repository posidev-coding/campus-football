<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!--
    THE HOPEFULS - the group's clubhouse mark: a cream club shield on navy,
    a lager chief across the top for first light, and a geometric TH cut
    into the field.

    Drawn for the sizes x-group-icon renders at (20px menu row, 32px card
    row, 36px hero, 44px hero from sm) and scaled UP, never drawn large and
    shrunk: the shield fills the tile, the chief is a 12-unit band and every
    letter stroke is a rectangle at least 7.5 units wide, with horizontals a
    hair thinner than verticals and the crossbar above center, the way a cut
    typeface does it. width/height are declared beside the viewBox on
    purpose - an <img> gives a viewBox-only SVG a square intrinsic size - and
    there is no clip path, so any rasterizer draws the same picture.
    Regenerate the-hopefuls-512.png from this file in the same commit as any
    redraw; the PNG is the upload cut.
  -->
  <rect width="100" height="100" fill="#0F1A2E"/>
  <path d="M 20 16 H 80 V 58 C 80 74 65 84 50 90 C 35 84 20 74 20 58 Z" fill="#F5F2EA"/>
  <path d="M 20 16 H 80 V 28 H 20 Z" fill="#E8A33C"/>
  <g fill="#0F1A2E">
    <rect x="27" y="38" width="22" height="7.5"/>
    <rect x="34.5" y="38" width="8" height="30"/>
    <rect x="52" y="38" width="8" height="30"/>
    <rect x="66" y="38" width="8" height="30"/>
    <rect x="52" y="49" width="22" height="7.5"/>
  </g>
</svg>
